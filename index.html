<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I miei animali Preferiti</title>
    <link rel="stylesheet" href="./assets/style.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>


<body>
    <script type="text/babel">
        const { useState } = React


        function Modal({ title, content, show = false, onClose = () => { }, onConfirm }) {
            return show && ReactDOM.createPortal(
                <div className="modal-container">
                    <div className="modal">
                        <h2>{title}</h2>
                        <p>{content}</p>
                        <button onClick={onClose}>Annulla</button>
                        <button onClick={() => onConfirm(content)}>Conferma</button>
                    </div>
                </div>,
                document.body
            )
        }


        const ReactApp = () => {
            const [animals, setAnimals] = useState([])
            const [show, setShow] = useState(false)
            const [newAnimal, setNewAnimal] = useState("")


            async function AggiungiAnimale(animale) {
                const results = await fetch(`http://localhost:3333/animals?search=${animale}`)
                const obj = await results.json()
                if(!obj.length) return
                setAnimals([...animals, { name: obj[0].name, description: obj[0].description, image: obj[0].image }])
            }


            return (
                <div>
                    <button onClick={() => setShow(true)}>Aggiungi animale</button>
                    <Modal
                        title="Aggiungi un animale"
                        content={<input value={newAnimal} onChange={(e) => setNewAnimal(e.target.value)} type='text' />}
                        show={show}
                        onClose={() => setShow(false)}
                        onConfirm={() => {
                            AggiungiAnimale(newAnimal)
                            setShow(false)
                            setNewAnimal("")
                        }}
                    />
                    <details>
                        <summary>Animali</summary>
                        <ul>
                            {
                                animals.map((animale, index) => (
                                    <li key={index}>
                                        <div className="card">
                                            <img src={animale.image} />
                                                <div className="container">
                                                    <h4><b>{animale.name}</b></h4>
                                                    <p>{animale.description}</p>
                                                </div>
                                        </div>
                                    </li>
                                ))
                            }
                        </ul>
                    </details>
                </div>
            )
        }
    </script>

    <header>
        <h1>I miei animali Preferiti</h1>
    </header>
    <main>
        <figure>
            <img src="https://picsum.photos/400/300" alt="Immagine Casuale">
        </figure>
        <div class="lista-animali"></div>
    </main>
    <footer>
        <p>Creato con amore da... un collega sbadato! 🐾</p>
    </footer>

    <script type="text/babel">
        const { createRoot } = ReactDOM
        const listaAnimali = document.querySelector(".lista-animali")
        const root = createRoot(listaAnimali)
        root.render(<ReactApp />)
    </script>
</body>


</html>
